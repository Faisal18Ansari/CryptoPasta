spring.application.name=CryptoPasta

server.port = 5454
# spring.profiles.active=dev

# Database Connection Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/CryptoPasta
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA Settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

stripe.api.key = STRIPE KEY
razorpay.api.key =${RAZORPAY_API_KEY}
razorpay.api.secret =${RAZORPAY_API_SECRET}

logging.level.org.springframework.security=DEBUG

coingecko.api.key=${COINGECKO_API_KEY}

# Gemini (chatbot)
gemini.api.key=${ZEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}